ong{font-size:13px}.tracked span{font-size:11px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tint{background:#f8f3fc;border-radius:13px;padding:15px}.tint.peach{background:#fff3ef}.tint.green{background:#f0f8f4}.tint.blue{background:#eff7ff}.tint strong{display:block;font-size:24px;margin:6px 0}.tint span{font-size:12px;color:#80798d}.week-grid{display:grid;grid-template-columns:76px repeat(7,minmax(18px,1fr));align-items:center;gap:7px;font-size:11px}.week-grid .checkcell{text-align:center;background:#eef8f2;color:#479877;padding:7px 0;border-radius:7px}.week-grid .dashcell{text-align:center;color:#c2bcca}.alert{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}.alert:last-child{border-bottom:0}.alert .ico{font-size:18px}.tag{background:#fff0e5;color:#ac784a;font-size:11px;border-radius:16px;padding:4px 8px}.tag.pink{background:#fceaf0;color:#bd6d87}.tag.green{background:#eaf7ef;color:#4c9171}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;background:var(--purple);color:white;border-radius:11px;padding:11px 15px;font-weight:700}.btn.outline{border:1px solid #ded7ec;background:#fff;color:#70608a}.btn.soft{background:#eee8f9;color:#7054aa}.btn:disabled{opacity:.4;cursor:not-allowed}.days{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.day{border:1px solid #e6e1ee;background:#fff;border-radius:11px;padding:10px 13px;color:#776d89}.day.active{background:#8065bf;color:white}.section{margin:22px 0}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick{background:white;border:1px solid #ece6f4;border-radius:15px;padding:20px 12px;text-align:center;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#50475f}.quick:hover{border-color:#aa93d9;background:#faf7ff}.quick .qicon{font-size:
